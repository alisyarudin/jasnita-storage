# API S3 (dipakai Laravel, aws cli, presigned URL)
server {
    listen 443 ssl http2;
    server_name s3.jascall.com;
    # ssl_certificate /etc/letsencrypt/live/s3.jascall.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/s3.jascall.com/privkey.pem;

    client_max_body_size 0;           # ukuran objek tidak dibatasi nginx
    proxy_request_buffering off;      # stream upload langsung ke jasstore
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    ignore_invalid_headers off;       # header x-amz-* dengan karakter khusus

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;   # WAJIB: host ikut ditandatangani SigV4
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Web console
server {
    listen 443 ssl http2;
    server_name storage.jascall.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
